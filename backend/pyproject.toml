[project]
name = "claims-intelligence"
version = "1.0.0"
description = "Agentic Hybrid RAG insurance claims investigation MVP"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "langgraph>=0.2.50",
    "langchain-core>=0.3.0",
    "openai>=1.55.0",
    "pinecone>=5.4.0,<6.0.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.26.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "PyMuPDF>=1.24.0",
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.0",
    "tenacity>=9.0.0",
    "tiktoken>=0.8.0",
    "truststore>=0.10.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
